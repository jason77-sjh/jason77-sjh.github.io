<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 지뢰찾기 (Minesweeper)</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트 Inter 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .cell-pop {
            animation: pop 0.15s ease-in-out;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* 드래그 영역 커스텀 스크롤바 감추기 또는 깔끔하게 유지 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #020617;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 select-none">

    <div class="w-full max-w-5xl bg-slate-800 rounded-2xl shadow-2xl p-4 sm:p-6 border border-slate-700 flex flex-col h-[94vh]">
        
        <!-- 게임 헤더 영역 -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3 shrink-0">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
                    💣 지뢰찾기
                </h1>
                <p class="text-xs text-slate-400 mt-1">드래그(패닝) 및 줌 버튼으로 넓은 판을 탐색하세요!</p>
            </div>

            <!-- 난이도 선택 버튼 -->
            <div class="flex bg-slate-700/60 p-1 rounded-xl border border-slate-600">
                <button onclick="changeDifficulty('beginner')" id="btn-beginner" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow">초급</button>
                <button onclick="changeDifficulty('intermediate')" id="btn-intermediate" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-300 hover:text-white">중급</button>
                <button onclick="changeDifficulty('expert')" id="btn-expert" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-300 hover:text-white">고급</button>
            </div>
        </div>

        <!-- 게임 상태 표시판 (LCD 스타일 LED 보드) -->
        <div class="bg-slate-950 p-3 sm:p-4 rounded-xl flex items-center justify-between mb-4 border border-slate-800 shadow-inner shrink-0">
            <!-- 남은 지뢰 수 표시 -->
            <div class="flex items-center gap-2">
                <span class="text-xs uppercase font-semibold text-slate-400">지뢰</span>
                <div id="mine-count" class="bg-black text-red-500 font-mono text-xl sm:text-2xl font-bold px-3 py-1 rounded-md tracking-wider border border-red-900/40">
                    010
                </div>
            </div>

            <!-- 리셋 / 스마일 버튼 -->
            <button onclick="resetGame()" id="face-btn" class="w-11 h-11 sm:w-12 sm:h-12 bg-amber-400 hover:bg-amber-300 active:scale-95 transition-all rounded-full flex items-center justify-center text-2xl shadow-lg border-2 border-amber-500">
                😊
            </button>

            <!-- 타이머 표시 -->
            <div class="flex items-center gap-2">
                <div id="timer" class="bg-black text-emerald-500 font-mono text-xl sm:text-2xl font-bold px-3 py-1 rounded-md tracking-wider border border-emerald-900/40">
                    000
                </div>
                <span class="text-xs uppercase font-semibold text-slate-400">시간</span>
            </div>
        </div>

        <!-- 상단 툴바 (모바일 깃발 모드 및 줌 제어) -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3 bg-slate-700/40 px-3 py-2 rounded-xl border border-slate-700 shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-xs sm:text-sm font-medium text-slate-300">📱 깃발 모드</span>
                <span id="flag-mode-status" class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-slate-600 text-slate-300">끄기</span>
                <button onclick="toggleFlagMode()" id="flag-mode-btn" class="ml-1 px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-600 hover:bg-slate-500 transition-all text-white">
                    토글 켜기
                </button>
            </div>

            <!-- 줌 / 패닝 안내 및 제어 버튼 -->
            <div class="flex items-center gap-1.5">
                <span class="text-xs text-slate-400 hidden md:inline">🔍 줌:</span>
                <button onclick="zoomBoard(-0.1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded-lg text-white font-bold flex items-center justify-center border border-slate-600 text-sm" title="축소">-</button>
                <span id="zoom-level-text" class="text-xs font-mono text-slate-300 w-10 text-center">100%</span>
                <button onclick="zoomBoard(0.1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded-lg text-white font-bold flex items-center justify-center border border-slate-600 text-sm" title="확대">+</button>
                <button onclick="resetZoom()" class="px-2 py-1 text-[11px] bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 border border-slate-600 ml-1">초기화</button>
            </div>
        </div>

        <!-- 게임 보드 드래그 가능 뷰포트 컨테이너 -->
        <div id="viewport-container" class="relative flex-1 bg-slate-950 rounded-xl border border-slate-800 overflow-auto custom-scrollbar cursor-grab active:cursor-grabbing shadow-inner flex items-center justify-center p-4">
            <!-- 내부 스케일링 컨테이너 -->
            <div id="board-scaler" class="transition-transform duration-75 origin-center flex items-center justify-center p-8">
                <div id="board" class="grid gap-1"></div>
            </div>
        </div>

        <!-- 최고 기록 표시 영역 -->
        <div class="mt-3 flex justify-between items-center text-xs text-slate-400 bg-slate-900/80 px-4 py-2.5 rounded-xl border border-slate-800 shrink-0">
            <span>🏆 최고 기록 (Best Time)</span>
            <span id="best-time" class="font-mono font-semibold text-amber-400">-- 초</span>
        </div>
    </div>

    <!-- 승리/패배 모달 팝업 알림 박스 -->
    <div id="message-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl cell-pop">
            <div id="modal-icon" class="text-5xl mb-3">🎉</div>
            <h3 id="modal-title" class="text-xl font-bold text-white mb-2">게임 승리!</h3>
            <p id="modal-desc" class="text-sm text-slate-300 mb-6">기록: 15초</p>
            <button onclick="closeModal(); resetGame();" class="w-full py-3 bg-blue-600 hover:bg-blue-500 transition-all text-white font-semibold rounded-xl shadow-lg">
                다시 하기
            </button>
        </div>
    </div>

    <script>
        // 난이도 설정 객체
        const difficulties = {
            beginner: { rows: 9, cols: 9, mines: 10, name: '초급' },
            intermediate: { rows: 16, cols: 16, mines: 40, name: '중급' },
            expert: { rows: 16, cols: 30, mines: 99, name: '고급' }
        };

        let currentDifficulty = 'beginner';
        let rows = difficulties[currentDifficulty].rows;
        let cols = difficulties[currentDifficulty].cols;
        let totalMines = difficulties[currentDifficulty].mines;

        let board = [];
        let gameOver = false;
        let gameWon = false;
        let firstClick = true;
        let flaggedCount = 0;
        let timerInterval = null;
        let timeElapsed = 0;
        let flagModeActive = false;
        let currentZoom = 1.0;

        // DOM 요소 캐싱
        const viewportContainer = document.getElementById('viewport-container');
        const boardScaler = document.getElementById('board-scaler');
        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const faceBtnEl = document.getElementById('face-btn');
        const bestTimeEl = document.getElementById('best-time');
        const modalEl = document.getElementById('message-modal');
        const modalIconEl = document.getElementById('modal-icon');
        const modalTitleEl = document.getElementById('modal-title');
        const modalDescEl = document.getElementById('modal-desc');
        const flagModeBtnEl = document.getElementById('flag-mode-btn');
        const flagModeStatusEl = document.getElementById('flag-mode-status');
        const zoomLevelText = document.getElementById('zoom-level-text');

        // 마우스 드래그 패닝(Panning) 상태 변수
        let isPanning = false;
        let startX, startY, scrollLeft, scrollTop;

        window.onload = function() {
            initGame();
            setupPanningEvents();
        };

        // 드래그 패닝 이벤트 설정 (마우스 및 터치 지원)
        function setupPanningEvents() {
            viewportContainer.addEventListener('mousedown', (e) => {
                // 우클릭이나 셀 직접 클릭 시 패닝 방지 (단, 공백 영역 드래그 시 패닝 활성화)
                if (e.button !== 0) return; 
                isPanning = true;
                viewportContainer.classList.add('cursor-grabbing');
                startX = e.pageX - viewportContainer.offsetLeft;
                startY = e.pageY - viewportContainer.offsetTop;
                scrollLeft = viewportContainer.scrollLeft;
                scrollTop = viewportContainer.scrollTop;
            });

            viewportContainer.addEventListener('mouseleave', () => {
                isPanning = false;
                viewportContainer.classList.remove('cursor-grabbing');
            });

            viewportContainer.addEventListener('mouseup', () => {
                isPanning = false;
                viewportContainer.classList.remove('cursor-grabbing');
            });

            viewportContainer.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                e.preventDefault();
                const x = e.pageX - viewportContainer.offsetLeft;
                const y = e.pageY - viewportContainer.offsetTop;
                const walkX = (x - startX) * 1.5;
                const walkY = (y - startY) * 1.5;
                viewportContainer.scrollLeft = scrollLeft - walkX;
                viewportContainer.scrollTop = scrollTop - walkY;
            });
        }

        // 줌 제어 함수
        function zoomBoard(amount) {
            currentZoom += amount;
            if (currentZoom < 0.5) currentZoom = 0.5;
            if (currentZoom > 2.0) currentZoom = 2.0;
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }

        function applyZoom() {
            boardScaler.style.transform = `scale(${currentZoom})`;
            zoomLevelText.textContent = `${Math.round(currentZoom * 100)}%`;
        }

        // 난이도 변경 함수
        function changeDifficulty(diff) {
            currentDifficulty = diff;
            rows = difficulties[diff].rows;
            cols = difficulties[diff].cols;
            totalMines = difficulties[diff].mines;

            ['beginner', 'intermediate', 'expert'].forEach(d => {
                const btn = document.getElementById(`btn-${d}`);
                if (d === diff) {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-300 hover:text-white";
                }
            });

            // 난이도별 기본 줌 레벨 최적화 (고급은 기본 줌을 약간 맞춤 혹은 1.0)
            if (diff === 'expert') {
                currentZoom = 0.85;
            } else {
                currentZoom = 1.0;
            }
            applyZoom();
            resetGame();
        }

        // 게임판 초기화
        function initGame() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeElapsed = 0;
            gameOver = false;
            gameWon = false;
            firstClick = true;
            flaggedCount = 0;
            
            updateTimerDisplay();
            updateMineCountDisplay();
            faceBtnEl.textContent = '😊';
            loadBestTime();

            board = [];
            for (let r = 0; r < rows; r++) {
                let rowArr = [];
                for (let c = 0; c < cols; c++) {
                    rowArr.push({
                        mine: false,
                        revealed: false,
                        flagged: false,
                        count: 0
                    });
                }
                board.push(rowArr);
            }

            renderBoard();
        }

        // 보드 DOM 렌더링
        function renderBoard() {
            boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            boardEl.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    // 적당한 셀 크기 확보 (w-8 h-8 등 유지하여 좁아지는 문제 방지 및 스크롤 패닝으로 탐색)
                    cell.className = "w-8 h-8 flex items-center justify-center text-sm font-bold rounded cursor-pointer select-none transition-colors duration-100 shrink-0";
                    
                    updateCellDOM(cell, board[r][c]);

                    cell.addEventListener('click', (e) => handleCellClick(r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });

                    boardEl.appendChild(cell);
                }
            }
        }

        function updateCellDOM(cellEl, cellData) {
            if (cellData.revealed) {
                if (cellData.mine) {
                    cellEl.className = "w-8 h-8 flex items-center justify-center text-sm font-bold rounded bg-red-600 text-white shadow-inner cell-pop shrink-0";
                    cellEl.textContent = '💣';
                } else {
                    cellEl.className = "w-8 h-8 flex items-center justify-center text-sm font-bold rounded bg-slate-800 border border-slate-700/50 shrink-0";
                    if (cellData.count > 0) {
                        cellEl.textContent = cellData.count;
                        const colors = {
                            1: 'text-blue-400',
                            2: 'text-emerald-400',
                            3: 'text-rose-400',
                            4: 'text-indigo-400',
                            5: 'text-amber-400',
                            6: 'text-teal-400',
                            7: 'text-purple-400',
                            8: 'text-pink-400'
                        };
                        cellEl.className += ` ${colors[cellData.count] || 'text-white'}`;
                    } else {
                        cellEl.textContent = '';
                    }
                }
            } else {
                if (cellData.flagged) {
                    cellEl.className = "w-8 h-8 flex items-center justify-center text-sm font-bold rounded bg-slate-700 hover:bg-slate-600 shadow border-t border-slate-600 cell-pop shrink-0";
                    cellEl.textContent = '🚩';
                } else {
                    cellEl.className = "w-8 h-8 flex items-center justify-center text-sm font-bold rounded bg-slate-700 hover:bg-slate-600 shadow border-t border-slate-600 transition-all shrink-0";
                    cellEl.textContent = '';
                }
            }
        }

        function placeMines(initialR, initialC) {
            let placed = 0;
            while (placed < totalMines) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);

                if (Math.abs(r - initialR) <= 1 && Math.abs(c - initialC) <= 1) continue;
                if (board[r][c].mine) continue;

                board[r][c].mine = true;
                placed++;
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr;
                                let nc = c + dc;
                                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].count = count;
                    }
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver || gameWon) return;

            let cell = board[r][c];
            if (cell.flagged) return;

            if (flagModeActive) {
                handleCellRightClick(r, c);
                return;
            }

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (cell.revealed && cell.count > 0) {
                let flagCount = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].flagged) {
                            flagCount++;
                        }
                    }
                }

                if (flagCount === cell.count) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr;
                            let nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !board[nr][nc].flagged && !board[nr][nc].revealed) {
                                revealCell(nr, nc);
                            }
                        }
                    }
                }
                checkWinCondition();
                refreshBoardDOM();
                return;
            }

            if (cell.revealed) return;

            revealCell(r, c);
            checkWinCondition();
            refreshBoardDOM();
        }

        function revealCell(r, c) {
            let cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;

            if (cell.mine) {
                triggerGameOver(r, c);
                return;
            }

            if (cell.count === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !board[nr][nc].revealed) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function handleCellRightClick(r, c) {
            if (gameOver || gameWon) return;

            let cell = board[r][c];
            if (cell.revealed) return;

            cell.flagged = !cell.flagged;
            if (cell.flagged) {
                flaggedCount++;
            } else {
                flaggedCount--;
            }

            updateMineCountDisplay();
            refreshBoardDOM();
        }

        function refreshBoardDOM() {
            const cells = boardEl.children;
            for (let i = 0; i < cells.length; i++) {
                let cellEl = cells[i];
                let r = parseInt(cellEl.dataset.row);
                let c = parseInt(cellEl.dataset.col);
                updateCellDOM(cellEl, board[r][c]);
            }
        }

        function checkWinCondition() {
            if (gameOver) return;

            let won = true;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].mine && !board[r][c].revealed) {
                        won = false;
                        break;
                    }
                }
                if (!won) break;
            }

            if (won) {
                gameWon = true;
                clearInterval(timerInterval);
                faceBtnEl.textContent = '😎';
                saveBestTime();
                showModal(true);
            }
        }

        function triggerGameOver(hitR, hitC) {
            gameOver = true;
            clearInterval(timerInterval);
            faceBtnEl.textContent = '😵';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) {
                        board[r][c].revealed = true;
                    }
                }
            }
            refreshBoardDOM();
            
            const cells = boardEl.children;
            for (let i = 0; i < cells.length; i++) {
                let cellEl = cells[i];
                let r = parseInt(cellEl.dataset.row);
                let c = parseInt(cellEl.dataset.col);
                if (r === hitR && c === hitC) {
                    cellEl.classList.add('bg-rose-700', 'animate-bounce');
                }
            }

            showModal(false);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeElapsed++;
                if (timeElapsed > 999) timeElapsed = 999;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            timerEl.textContent = String(timeElapsed).padStart(3, '0');
        }

        function updateMineCountDisplay() {
            let remaining = totalMines - flaggedCount;
            mineCountEl.textContent = (remaining < 0 ? '-' : '') + String(Math.abs(remaining)).padStart(2, '0');
        }

        function resetGame() {
            closeModal();
            initGame();
        }

        function toggleFlagMode() {
            flagModeActive = !flagModeActive;
            if (flagModeActive) {
                flagModeBtnEl.className = "ml-1 px-2.5 py-1 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-500 transition-all text-white shadow";
                flagModeBtnEl.textContent = "토글 끄기";
                flagModeStatusEl.className = "text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-semibold";
                flagModeStatusEl.textContent = "켜짐 (클릭=깃발)";
            } else {
                flagModeBtnEl.className = "ml-1 px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-600 hover:bg-slate-500 transition-all text-white";
                flagModeBtnEl.textContent = "토글 켜기";
                flagModeStatusEl.className = "text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-slate-600 text-slate-300";
                flagModeStatusEl.textContent = "끄기";
            }
        }

        function loadBestTime() {
            let bestTimes = JSON.parse(localStorage.getItem('minesweeper_best_times')) || {};
            let best = bestTimes[currentDifficulty];
            if (best !== undefined) {
                bestTimeEl.textContent = `${best} 초`;
            } else {
                bestTimeEl.textContent = '-- 초';
            }
        }

        function saveBestTime() {
            let bestTimes = JSON.parse(localStorage.getItem('minesweeper_best_times')) || {};
            let currentBest = bestTimes[currentDifficulty];
            if (currentBest === undefined || timeElapsed < currentBest) {
                bestTimes[currentDifficulty] = timeElapsed;
                localStorage.setItem('minesweeper_best_times', JSON.stringify(bestTimes));
                loadBestTime();
            }
        }

        function showModal(isWin) {
            if (isWin) {
                modalIconEl.textContent = '🎉';
                modalTitleEl.textContent = '게임 승리!';
                modalDescEl.textContent = `축하합니다! ${timeElapsed}초 만에 모든 지뢰를 찾았습니다.`;
            } else {
                modalIconEl.textContent = '💥';
                modalTitleEl.textContent = '게임 오버';
                modalDescEl.textContent = '지뢰를 밟았습니다. 다시 도전해보세요!';
            }
            modalEl.classList.remove('hidden');
            modalEl.classList.add('flex');
        }

        function closeModal() {
            modalEl.classList.remove('flex');
            modalEl.classList.add('hidden');
        }
    </script>
</body>
</html>
