        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        /* Object hover & animation */
        .interactive-obj {
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: pointer;
        }
        .interactive-obj:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.8));
        }

        /* Pulsing indicator for unsolved interactive objects */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4)); }

        }
        .unsolved {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        /* Digital Clock Blink */
        @keyframes clock-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .colon-blink {
            animation: clock-blink 1s infinite;
        }

            opacity: 0;
            transform: scale(0.9);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, transform 0.3s ease;

    </style>

    <!-- JavaScript Logic -->
    <script>
        /* -------------------------------------------------- */
        /* Web Audio API Synthesizer Sound Effects           */
        /* -------------------------------------------------- */
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'correct') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(140, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'escape') {
                // Fanfare chord
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + 1.2);
                });
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('audio-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        /* -------------------------------------------------- */
        /* Game State & Data                                  */
        /* -------------------------------------------------- */
        const gameState = {
            1: { solved: false, answer: ["NE", "네온"], clue: "첫 번째 암호: [1]" },
            2: { solved: false, answer: ["중립외교", "중립 외교"], clue: "두 번째 암호: [0]" },
            3: { solved: false, answer: ["3"], clue: "세 번째 암호: [3]" },
            4: { solved: false, answer: ["AI", "에이아이"], clue: "네 번째 암호: [5]" },
            5: { solved: false }
        };

        let currentActiveProblem = null;
        let padInput = "";
        let secondsElapsed = 0;
        let timerInterval = null;

        // Problem Definitions
        const problemsData = {
            1: {
                subject: "통합과학",
                title: "과학 연습장",
                icon: "fa-flask",
                iconBg: "bg-cyan-500/20 text-cyan-400",
                desc: "책상 위 과학 연습장에 메모가 적혀 있다.<br/><br/><b>[문제]</b> 주기율표의 18족에 속하며 안정된 전자 배치를 이루는 '비활성 기체' 중, <b>원자 번호 10번</b> 원소의 기호(또는 이름)는 무엇일까?",
                itemTitle: "네온 (Ne) - 10번"
            },
            2: {
                subject: "한국사",
                title: "역사 교재",
                icon: "fa-book-open",
                iconBg: "bg-amber-500/20 text-amber-400",
                desc: "책장에서 찾은 역사책에 형광펜이 칠해져 있다.<br/><br/><b>[문제]</b> 조선의 광해군이 임진왜란 이후 명나라와 후금 사이에서 신중을 기하며 명분의 대립을 피하고 실리를 취하고자 펼친 외교 정책의 명칭은 무엇인가? (4글자)",
                itemTitle: "중립외교"
            },
            3: {
                subject: "수학",
                title: "태블릿 화면",
                icon: "fa-calculator",
                iconBg: "bg-indigo-500/20 text-indigo-400",
                desc: "태블릿 PC 화면에 수학 방정식이 켜져 있다.<br/><br/><b>[문제]</b> 이차방정식 <b>x² - 5x + 6 = 0</b> 을 만족하는 두 근 중 <b>더 큰 근의 값</b>은 무엇인가?",
                itemTitle: "x = 3"
            },
            4: {
                subject: "영어",
                title: "단어장 카렌다",
                icon: "fa-language",
                iconBg: "bg-rose-500/20 text-rose-400",
                desc: "벽에 걸린 영단어 달력에 오늘의 단어가 적혀 있다.<br/><br/><b>[문제]</b> '인공지능'을 뜻하는 영어 단어 <b>'Artificial Intelligence'</b>의 알파벳 약어 두 글자는 무엇인가?",
                itemTitle: "A.I."
            },
            5: {
                subject: "최종 탈출",
                title: "디지털 도어락",
                icon: "fa-key",
                iconBg: "bg-emerald-500/20 text-emerald-400",
                desc: "방 문에 설치된 도어락이다.<br/><br/><b>[힌트 조합]</b> 각 문제를 해결하여 획득한 4자리 암호를 입력해야 문이 열린다.<br/>(획득한 단서 1~4번의 숫자를 순서대로 입력하세요!)"
            }
        };

        /* -------------------------------------------------- */
        /* Timer Logic                                        */
        /* -------------------------------------------------- */
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('game-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        /* -------------------------------------------------- */
        /* Modal & Problem Handling                           */
        /* -------------------------------------------------- */
        function openProblem(problemId) {
            playSound('click');
            currentActiveProblem = problemId;
            const data = problemsData[problemId];

            // Set Header & Content
            document.getElementById('modal-subject').innerText = data.subject;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-description').innerHTML = data.desc;

            // Set Icon Style
            const iconBg = document.getElementById('modal-icon-bg');
            iconBg.className = `p-3 rounded-xl ${data.iconBg}`;
            document.getElementById('modal-icon').className = `fa-solid ${data.icon} text-2xl`;

            // Toggle Standard Input Form vs Keypad Form
            const stdForm = document.getElementById('standard-answer-form');
            const padForm = document.getElementById('doorlock-keypad-form');
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');

            if (problemId === 5) {
                stdForm.classList.add('hidden');
                padForm.classList.remove('hidden');
                clearPad();
            } else {
                stdForm.classList.remove('hidden');
                padForm.classList.add('hidden');

                const input = document.getElementById('answer-input');
                input.value = "";
                if (gameState[problemId].solved) {
                    input.placeholder = "이미 정답을 맞췄습니다!";
                    input.disabled = true;
                } else {
                    input.placeholder = "답안을 작성하세요";
                    input.disabled = false;
                    setTimeout(() => input.focus(), 100);
                }
            }

            // Show Modal
            const modal = document.getElementById('modal-overlay');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            playSound('click');
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function submitAnswer() {
            if (!currentActiveProblem || currentActiveProblem === 5) return;

            const input = document.getElementById('answer-input').value.trim().toUpperCase();
            const validAnswers = gameState[currentActiveProblem].answer.map(a => a.toUpperCase());
            const errorMsg = document.getElementById('error-msg');

            if (validAnswers.includes(input)) {
                // Correct Answer!
                playSound('correct');
                gameState[currentActiveProblem].solved = true;

                // Update UI for object & inventory
                markObjectSolved(currentActiveProblem);
                updateInventorySlot(currentActiveProblem);

                closeModal();
            } else {
                // Wrong Answer
                playSound('wrong');
                errorMsg.classList.remove('hidden');
            }
        }

        /* -------------------------------------------------- */
        /* Keypad / Door lock Logic (Problem 5)              */
        /* -------------------------------------------------- */
        function pressPad(num) {
            playSound('click');
            if (padInput.length < 4) {
                padInput += num;
                updatePadDisplay();
            }
        }

        function clearPad() {
            playSound('click');
            padInput = "";
            updatePadDisplay();
            document.getElementById('door-error-msg').classList.add('hidden');
        }

        function updatePadDisplay() {
            const display = document.getElementById('doorlock-display');
            display.innerText = padInput.padEnd(4, '-');
        }

        function submitDoorLock() {
            // Target Pin Code: 1035 (Q1: 1, Q2: 0, Q3: 3, Q4: 5)
            const targetPin = "1035";
            const errorText = document.getElementById('door-error-msg');

            if (padInput === targetPin) {
                playSound('escape');
                clearInterval(timerInterval);
                closeModal();

                // Show Final Success Screen
                document.getElementById('final-time').innerText = document.getElementById('game-timer').innerText;
                document.getElementById('success-modal').classList.remove('hidden');
            } else {
                playSound('wrong');
                errorText.classList.remove('hidden');
                padInput = "";
                updatePadDisplay();
            }
        }

        /* -------------------------------------------------- */
        /* UI State Updates                                   */
        /* -------------------------------------------------- */
        function markObjectSolved(id) {
            let objId = "";
            if (id === 1) objId = "obj-science-note";
            if (id === 2) objId = "obj-bookshelf";
            if (id === 3) objId = "obj-laptop";
            if (id === 4) objId = "obj-calendar";

            const el = document.getElementById(objId);
            if (el) {
                el.classList.remove('unsolved');
                el.setAttribute('filter', 'drop-shadow(0 0 8px rgba(74, 222, 128, 0.8))');
            }
        }

        function updateInventorySlot(id) {
            const slot = document.getElementById(`slot-${id}`);
            const clueText = gameState[id].clue;
            
            slot.className = "bg-slate-800 border border-emerald-500/60 rounded-lg p-2 flex items-center justify-center min-w-[120px] text-xs font-bold text-emerald-400 shadow-sm animate-pulse";
            setTimeout(() => slot.classList.remove('animate-pulse'), 1000);

            let iconName = "fa-check";
            if (id === 1) iconName = "fa-flask";
            if (id === 2) iconName = "fa-book-open";
            if (id === 3) iconName = "fa-calculator";
            if (id === 4) iconName = "fa-language";

            slot.innerHTML = `<i class="fa-solid ${iconName} mr-1.5 text-emerald-400"></i> <span>${clueText}</span>`;
        }

        function resetGamePrompt() {
            if (confirm("게임을 처음부터 다시 시작하시겠습니까?")) {
                location.reload();
            }
        }

        // Initialize on load
        window.onload = function() {
            startTimer();
        };
    </script>
</body>
</html>
